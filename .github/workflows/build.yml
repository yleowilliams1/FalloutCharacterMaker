name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # lets you trigger a build manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-raylib
          path-type: inherit  # adds mingw64/bin to the normal Windows PATH
      - name: Build
        shell: cmd
        run: WINDOWS.bat src FalloutCharacterMaker.exe
      - name: Package
        shell: cmd
        run: |
          mkdir dist
          copy FalloutCharacterMaker.exe dist\
          copy CharacterSheet.png dist\
          copy fallout.ttf dist\
          xcopy /E /I data dist\data
          copy C:\msys64\mingw64\bin\libraylib.dll dist\ 2>nul || exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install raylib
        run: brew install raylib
      - name: Build
        run: ./MAC.mac src FalloutCharacterMaker
      - name: Package
        run: |
          mkdir dist
          cp FalloutCharacterMaker CharacterSheet.png fallout.ttf dist/
          cp -r data dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y libraylib-dev
      - name: Build
        run: ./LINUX.sh src FalloutCharacterMaker
      - name: Package
        run: |
          mkdir dist
          cp FalloutCharacterMaker CharacterSheet.png fallout.ttf dist/
          cp -r data dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip each platform build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
